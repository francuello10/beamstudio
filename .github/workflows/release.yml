name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Copy logger.cjs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp src/main/logger.cjs out/main/logger.cjs || true
      
      - name: Copy logger.cjs (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp src/main/logger.cjs out/main/logger.cjs || true
      
      - name: Build installers (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ""
        run: npm run dist
      
      - name: Build installers (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ""
        run: npx electron-builder --win --x64
      
      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            dist/*.exe
          retention-days: 30
          if-no-files-found: warn
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
      actions: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
          if-no-files-found: warn
      
      - name: Setup GitHub CLI
        run: gh auth setup-git
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Check if release exists
        id: check_release
        run: |
          if gh release view ${{ github.ref_name }} &>/dev/null; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release exists, will upload files only"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release does not exist, will create it"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      
      - name: Create Release (if not exists)
        if: steps.check_release.outputs.exists != 'true'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: List artifacts
        run: |
          echo "=== Artifacts found ==="
          find artifacts -type f || echo "No artifacts directory"
          ls -lah artifacts/ || echo "Artifacts directory not found"
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" \) || echo "No installer files found"
      
      - name: Upload files to existing release
        if: steps.check_release.outputs.exists == 'true'
        run: |
          echo "Release exists, uploading files..."
          echo "Looking for files in artifacts directory..."
          
          # Find and upload each file type (handle spaces in filenames correctly)
          find artifacts -type f \( -name "*.deb" -o -name "*.AppImage" -o -name "*.exe" \) -print0 | while IFS= read -r -d '' file; do
            if [ -f "$file" ]; then
              size=$(du -h "$file" | cut -f1)
              echo "Uploading: $file ($size)"
              gh release upload ${{ github.ref_name }} "$file" --clobber
              echo "✅ Uploaded: $(basename "$file")"
            fi
          done
          
          echo "=== Upload complete ==="
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
