name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags like v1.0.0, v1.0.1, etc.
  workflow_dispatch:  # Allow manual trigger

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
      
      - name: Copy logger.cjs (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cp src/main/logger.cjs out/main/logger.cjs || true
      
      - name: Copy logger.cjs (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: cp src/main/logger.cjs out/main/logger.cjs || true
      
      - name: Build installers (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ""
        run: npm run dist
      
      - name: Build installers (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ""
        run: npx electron-builder --win --x64
      
      - name: Upload artifacts (Linux)
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installers-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          retention-days: 30
          if-no-files-found: warn
      
      - name: Upload artifacts (Windows)
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: installers-windows
          path: |
            dist/*.exe
          retention-days: 30
          if-no-files-found: warn
  
  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true
          if-no-files-found: warn
      
      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          files: artifacts/**/*
          generate_release_notes: false
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
